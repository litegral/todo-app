<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Todo</h1>
        <p class="app__subtitle" id="summary">Nothing yet</p>
      </header>

      <form class="composer" id="composer" autocomplete="off">
        <input
          class="composer__input"
          id="new-todo"
          type="text"
          maxlength="200"
          placeholder="What needs doing?"
          aria-label="New todo"
        />
        <button class="composer__submit" type="submit">Add</button>
      </form>

      <p class="error" id="error" role="alert" hidden></p>

      <ul class="list" id="list" aria-label="Todos"></ul>

      <p class="empty" id="empty" hidden>No todos yet. Add your first one above.</p>

      <footer class="app__footer">
        <div class="filters" role="group" aria-label="Filter todos">
          <button class="filter is-active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="active">Active</button>
          <button class="filter" type="button" data-filter="completed">Completed</button>
        </div>
        <button class="link-button" type="button" id="clear-completed" disabled>
          Clear completed
        </button>
      </footer>
    </main>

    <template id="todo-template">
      <li class="todo">
        <label class="todo__label">
          <input class="todo__checkbox" type="checkbox" />
          <span class="todo__title"></span>
        </label>
        <div class="todo__actions">
          <button class="icon-button" type="button" data-action="edit">Edit</button>
          <button class="icon-button icon-button--danger" type="button" data-action="delete">
            Delete
          </button>
        </div>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
